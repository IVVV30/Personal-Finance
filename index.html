<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>個人財務監控</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one-screen app shell. phone = top bar / page / bottom nav; >=900px = left rail + page */
  color-scheme:dark;
  --bg:#0B1220;--s1:#121C2E;--s2:#18243A;--s3:#21304B;--line:#2A3A55;
  --tx:#EAF2FF;--mu:#8FA0BA;--mint:#3DDC97;--on-mint:#06281A;--coral:#FF6B5E;--amber:#F5B83D;--sky:#4CC2FF;
  --num:"Chakra Petch","Noto Sans TC",sans-serif;--body:"Noto Sans TC",system-ui,-apple-system,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.mu{color:var(--mu)}.hidden{display:none!important}
.ic{flex:none;vertical-align:-3px}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
header{display:flex;align-items:center;gap:8px;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--bg)}
header h1{font-size:15px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hchip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:var(--s2);font-size:12px;color:var(--mu);white-space:nowrap}
.hchip.on{color:var(--amber)}.hchip.ok{color:var(--mint)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mu)}.dot.ok{background:var(--mint)}.dot.err{background:var(--coral)}.dot.sync{background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.ibtn{border:1px solid var(--line);background:var(--s1);border-radius:8px;min-width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center}
main{overflow-y:auto;min-height:0}
nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--s1);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:transparent;color:var(--mu);padding:7px 0 6px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;min-height:52px}
nav button.on{color:var(--mint)}
nav button.add .ic{color:var(--mint)}
nav .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--coral);color:#2A0703;border-radius:999px;font-size:11px;font-weight:700;padding:0 5px;min-width:16px;font-family:var(--num)}
.page{display:none;padding:10px 14px 16px;max-width:1080px;margin:0 auto}
.page.on{display:block}
@media(min-width:900px){
  #app{grid-template-columns:184px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  header{grid-column:2;grid-row:1}main{grid-column:2;grid-row:2}
  nav{grid-column:1;grid-row:1/3;display:flex;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:14px 10px;gap:4px}
  nav button{flex-direction:row;gap:10px;font-size:14px;padding:10px 12px;border-radius:8px;min-height:44px;justify-content:flex-start}
  nav button.on{background:var(--s2)}
  nav .badge{position:static;margin-left:auto}
  .page{padding:16px 24px 24px}
}
.banner{background:#3A2A12;border:1px solid #6B4A14;color:#FFD99A;border-radius:var(--r);padding:8px 12px;margin:10px 14px 0;font-size:13px}
.banner.err{background:#3B1614;border-color:#7A2A24;color:#FFC2BC}
/* shared */
.card{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px}
.card h2{font-size:13px;margin:0 0 8px;color:var(--mu);font-weight:500}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--s2);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 4px;color:var(--mu);min-height:32px}
.seg button.on{background:var(--s3);color:var(--mint);font-weight:500}
.seg button.on[data-v="支出"]{color:var(--coral)}
.btn{border:0;background:var(--mint);color:var(--on-mint);border-radius:var(--r);padding:11px 14px;font-weight:700;font-size:15px;min-height:44px;width:100%}
.btn:disabled{opacity:.6}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx);font-weight:500;font-size:14px}
.btn.danger{background:transparent;border:1px solid #7A2A24;color:var(--coral);font-weight:500;font-size:14px}
.btn.sm{width:auto;min-height:32px;padding:5px 10px;font-size:13px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--s3);color:var(--mu);white-space:nowrap}
.tag.g{background:#0F3A2A;color:var(--mint)}.tag.a{background:#3A2A12;color:var(--amber)}.tag.r{background:#3B1614;color:var(--coral)}.tag.b{background:#0F2D44;color:var(--sky)}
.hp{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;height:8px}
.hp i{background:var(--s3);border-radius:2px}.hp i.f{background:var(--mint)}.hp.a i.f{background:var(--amber)}.hp.r i.f{background:var(--coral)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.tabs button{border:1px solid var(--line);background:var(--s1);border-radius:999px;padding:6px 14px;white-space:nowrap;color:var(--mu);min-height:34px}
.tabs button.on{background:var(--mint);color:var(--on-mint);border-color:var(--mint);font-weight:500}
.rowi{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);min-height:48px}
.rowi:last-child{border-bottom:0}
.rowi.tap{cursor:pointer}.rowi.tap:active{background:var(--s2)}
.rowi .t{flex:1;min-width:0}.rowi .t b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .t small{color:var(--mu);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .v{text-align:right;white-space:nowrap}
.cicon{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:var(--s2);flex:none}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.kv .k{color:var(--mu)}.kv .v{text-align:right}
.kv .n{grid-column:1/-1;font-size:12px;color:var(--mu);margin-top:-4px}
.note{font-size:12px;color:var(--mu);margin-top:8px}
.empty{color:var(--mu);text-align:center;padding:18px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
/* entry */
#p-add.on{display:flex;flex-direction:column;height:100%;padding-top:8px;padding-bottom:8px}
.addwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;flex:1;min-height:0}
.form{display:flex;flex-direction:column;gap:6px;min-height:0}
@media(min-width:900px){.addwrap{grid-template-columns:minmax(0,440px) minmax(0,1fr)}#p-add.on{height:auto}}
.amtrow{display:flex;gap:6px}
.amt{flex:1;border:1px solid var(--line);background:var(--s1);border-radius:var(--r);text-align:right;padding:4px 12px;font-size:30px;font-weight:600;min-height:50px}
.amt.zero{color:var(--mu)}.amt.miss,.fd.miss,.cats.miss,.subs.miss{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint)}
.cur{width:76px;border:1px solid var(--line);background:var(--s1);border-radius:var(--r);padding:0 6px}
.cats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:48px;gap:6px;border:1px solid transparent;border-radius:var(--r)}
.tile{border:1px solid transparent;background:var(--s1);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;color:var(--mu);padding:0}
.tile.on{background:var(--s3);border-color:currentColor}
.subs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-height:34px;align-items:center;border:1px solid transparent;border-radius:var(--r)}
.chip{border:1px solid var(--line);background:var(--s1);border-radius:999px;padding:4px 12px;white-space:nowrap;color:var(--tx);min-height:32px}
.chip.on{background:var(--mint);color:var(--on-mint);border-color:var(--mint);font-weight:500}
.chip.dash{border-style:dashed;color:var(--mu)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fd{position:relative;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:3px 10px 4px;min-width:0;min-height:46px;display:flex;flex-direction:column;justify-content:center}
.fd label{font-size:11px;color:var(--mu);display:flex;gap:6px;align-items:center}
.fd label em{font-style:normal;color:var(--mint)}
.fd input,.fd select{border:0;background:transparent;padding:0;width:100%;min-width:0;height:22px;outline:0}
.fd select{appearance:none;-webkit-appearance:none;text-overflow:ellipsis}
.fd select option{background:var(--s1)}
.fd .ppb{border:0;background:transparent;text-align:left;padding:0;height:22px}
.fd.wide{grid-column:1/-1}
.ac{position:absolute;left:-1px;right:-1px;bottom:calc(100% + 4px);background:var(--s3);border:1px solid var(--line);border-radius:var(--r);z-index:8;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.ac button{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:9px 10px;min-height:40px}
.ac button:last-child{border-bottom:0}.ac button small{color:var(--mu)}
.instrow{display:flex;align-items:center;justify-content:space-between;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:0 10px;min-height:40px;width:100%;text-align:left}
.sw{width:34px;height:20px;border-radius:999px;background:var(--s3);position:relative;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--mu);transition:transform .15s}
.sw.on{background:var(--mint)}.sw.on::after{transform:translateX(14px);background:var(--on-mint)}
.side{display:none}
@media(min-width:900px){.side{display:block}}
/* keypad */
.mask{position:fixed;inset:0;background:rgba(4,8,16,.66);z-index:40;display:none;align-items:center;justify-content:center}
.mask.on{display:flex}
.kp{width:min(92vw,350px);background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 16px 48px rgba(0,0,0,.6);animation:rise .18s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:.4}}
@media(prefers-reduced-motion:reduce){.kp,.sheet{animation:none!important}.dot.sync{animation:none}}
.kp .scr{background:var(--bg);border-radius:var(--r);padding:8px 12px;text-align:right;margin-bottom:10px;min-height:68px}
.kp .scr small{display:block;color:var(--mu);min-height:18px;font-family:var(--num)}
.kp .scr b{font-size:32px;font-weight:600}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keys button{border:0;background:var(--s3);border-radius:9px;min-height:48px;font-family:var(--num);font-size:19px;font-weight:500}
.keys button:active{background:var(--line)}
.keys button.op{color:var(--sky)}.keys button.done{grid-column:span 2;background:var(--mint);color:var(--on-mint);font-family:var(--body);font-size:15px;font-weight:700}
/* sheet */
.sheetmask{align-items:flex-end}
.sheet{background:var(--s1);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;border:1px solid var(--line);padding:14px 14px calc(14px + env(safe-area-inset-bottom));animation:rise .18s ease-out;display:flex;flex-direction:column;gap:8px}
@media(min-width:900px){.sheetmask{align-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:0;font-size:16px}
.sheet .fl{font-size:12px;color:var(--mu);margin-top:4px}
.sheet input,.sheet select{width:100%;border:1px solid var(--line);background:var(--s2);border-radius:var(--r);padding:9px 10px;min-height:42px}
.sheet input:disabled,.sheet select:disabled{opacity:.6}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.pick button{border:1px solid var(--line);background:var(--s2);border-radius:9px;height:42px;display:flex;align-items:center;justify-content:center}
.pick button.on{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));background:var(--s3);border:1px solid var(--line);color:var(--tx);padding:9px 12px;border-radius:12px;font-size:13px;z-index:60;max-width:92%;display:none;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#toast.on{display:flex}
#toast button{border:0;background:transparent;color:var(--mint);font-weight:700;padding:4px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--mint);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
/* dashboard */
.hero{display:grid;gap:8px;margin-bottom:10px}
.hero .big{font-size:40px;font-weight:600;line-height:1.1}
.hero .big.neg{color:var(--coral)}
.statline{display:flex;gap:6px;flex-wrap:wrap}
.fbar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--s3)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px;margin:8px 0}
.sum{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.sum small{color:var(--mu);font-size:11px;display:block}.sum b{font-size:17px;font-weight:600}
.dayh{font-size:12px;color:var(--mu);padding:10px 2px 2px;display:flex;justify-content:space-between}
.lbar{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.lbar .lbl{flex:1;text-align:center;font-weight:500}
.catcard{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.cathead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.cathead b{font-size:15px}
.subrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.budline{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mu);margin-top:3px}
.lnk{border:0;background:transparent;color:var(--sky);padding:4px 6px;font-size:13px;min-height:32px}
.lnk.r{color:var(--coral)}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>個人財務監控</h1>
  <span class="hchip" id="chStreak" title="連續記帳天數"></span>
  <span class="hchip" id="chWeek" title="本週浮動預算"></span>
  <span class="dot sync" id="dot" title="連線狀態"></span>
  <button class="ibtn" id="btnRefresh" aria-label="重新整理"></button>
</header>
<main>
  <div id="banner" class="banner hidden"></div>

  <section class="page" id="p-add">
    <div class="addwrap">
      <div class="form">
        <div class="seg" id="typeSeg"><button data-v="支出">支出</button><button data-v="收入">收入</button><button data-v="轉帳">轉帳</button></div>
        <div class="amtrow">
          <button class="amt num zero" id="amtBtn" aria-label="金額">0</button>
          <select class="cur" id="fCur" aria-label="幣別"></select>
        </div>
        <button class="amt num zero hidden" id="twdBtn" style="font-size:20px;min-height:40px" aria-label="台幣金額">台幣金額（銀行實扣）</button>
        <div class="cats" id="catGrid"></div>
        <div class="subs" id="subRow"></div>
        <div class="fields" id="fields">
          <div class="fd" id="cFrom"><label for="fFrom"><span id="lFrom">帳戶</span><em id="aFrom"></em></label><select id="fFrom"></select></div>
          <div class="fd" id="cTo"><label for="fTo">到帳戶<em id="aTo"></em></label><select id="fTo"></select></div>
          <div class="fd" id="cDate"><label for="fDate" id="lDate">日期</label><input id="fDate" type="date"></div>
          <div class="fd" id="cPP"><label>公私<em id="aPP"></em></label><button class="ppb" id="fPP">私</button></div>
          <div class="fd" id="cProject"><label for="fProject">專案</label><input id="fProject" placeholder="選填" autocomplete="off"></div>
          <div class="fd" id="cCommit"><label for="fCommit">對應承諾</label><select id="fCommit"></select></div>
          <div class="fd inv" id="cInvAcct"><label for="fInvAcct">證券戶</label><select id="fInvAcct"></select></div>
          <div class="fd inv" id="cInvAct"><label for="fInvAct">動作</label><select id="fInvAct"></select></div>
          <div class="fd inv" id="cInvCode"><label for="fInvCode">代號</label><input id="fInvCode" placeholder="2330" autocomplete="off"></div>
          <div class="fd inv" id="cInvName"><label for="fInvName">名稱</label><input id="fInvName" placeholder="台積電" autocomplete="off"></div>
          <div class="fd inv" id="cInvQty"><label for="fInvQty">股數</label><input id="fInvQty" inputmode="decimal" placeholder="1000"></div>
          <div class="fd inv" id="cInvPrice"><label for="fInvPrice">成交價</label><input id="fInvPrice" inputmode="decimal" placeholder="選填"></div>
          <div class="fd inv" id="cInvMkt"><label for="fInvMkt">市場</label><select id="fInvMkt"><option value="台股">台股（T+2）</option><option value="美股">美股（T+1）</option></select></div>
          <div class="fd inv wide" id="cInvPay"><label for="fInvPay">扣款帳戶（交割日從這裡扣或入帳）</label><select id="fInvPay"></select></div>
          <div class="fd inv" id="cInvSettle"><label for="fInvSettle">交割日（扣帳）<em id="aSettle"></em></label><input id="fInvSettle" type="date"></div>
          <div class="fd" id="cMerchant"><label for="fMerchant"><span id="lMerchant">商家</span><em id="aMerchant"></em></label><input id="fMerchant" placeholder="選填" autocomplete="off"></div>
          <div class="fd" id="cNote"><label for="fNote">備註</label><input id="fNote" placeholder="選填" autocomplete="off"></div>
        </div>
        <div class="note hidden" id="modeHint" style="margin:0"></div>
        <button class="instrow" id="instToggle"><span>分期付款</span><span class="sw" id="instSw"></span></button>
        <div class="fields hidden" id="instFields">
          <div class="fd"><label for="iKind">分期方式</label><select id="iKind"><option value="卡分期">卡分期</option><option value="無卡分期">無卡分期</option></select></div>
          <div class="fd"><label for="iN">期數</label><input id="iN" inputmode="numeric" placeholder="6"></div>
          <div class="fd nc"><label for="iCo">分期公司</label><select id="iCo"></select></div>
          <div class="fd nc"><label for="iPay">每月扣款戶頭</label><select id="iPay"></select></div>
          <div class="fd"><label for="iFee">每期利息</label><input id="iFee" inputmode="decimal" placeholder="0"></div>
          <div class="fd"><label for="iPer">每期金額</label><input id="iPer" inputmode="decimal"></div>
          <div class="fd"><label for="iFirst">第一期年月</label><input id="iFirst" placeholder="2026/12"></div>
          <div class="fd"><label for="iDay">每月扣款日</label><input id="iDay" inputmode="numeric"></div>
          <div class="note wide" id="iHint" style="grid-column:1/-1;margin:0"></div>
        </div>
        <button class="btn" id="btnSave" style="margin-top:auto">記一筆</button>
      </div>
      <aside class="side">
        <div class="card"><h2>今日明細</h2><div id="todayList"></div></div>
      </aside>
    </div>
  </section>

  <section class="page" id="p-ledger">
    <div class="seg" id="lMode" style="margin-bottom:8px"><button data-v="日">日</button><button data-v="週">週</button><button data-v="月">月</button></div>
    <div class="lbar"><button class="ibtn" id="lPrev" aria-label="上一期"></button><div class="lbl num" id="lLabel"></div><button class="ibtn" id="lNext" aria-label="下一期"></button><button class="btn ghost sm" id="lToday">今天</button></div>
    <div class="seg" id="lFilter"><button data-v="all">全部</button><button data-v="pending">待核實</button></div>
    <div class="sumgrid" id="lSum"></div>
    <div class="hidden" id="lPendBar" style="margin-bottom:6px"><button class="btn ghost" id="lVerifyAll">全部核實</button></div>
    <div class="card" id="lList" style="padding:4px 12px"></div>
  </section>

function defaultsFor(c){
  const a=acct(c.acct),t=a?a.type:'';
  const firstSav=(S.accounts.find(x=>x.type==='活存'&&x.status==='使用中')||{}).id||'';
  if(['貸款','無卡分期'].includes(c.type)||['貸款','分期'].includes(t)){
    if(['貸款','分期'].includes(t))return {type:'還款',from:ls('payfrom:'+c.id)||firstSav,to:c.acct,cat:'轉帳',sub:'帳戶互轉'};
    const buy=txObjs().find(x=>x.cid===c.id&&x.type==='支出');
    return {type:'還款',from:c.acct,to:buy?buy.from:'',cat:'轉帳',sub:'帳戶互轉'};
  }
  let cat='生活',sub='訂閱軟體';
  if(c.type==='訂閱'){if(/影|音|樂|Netflix|Spotify|Disney|YouTube|KKBOX/i.test(c.name))sub='訂閱影音';}
  else if(c.type==='家用'){cat='家庭';sub='孝親費';}
  else if(c.type==='固定支出'){cat='家居';sub=/水|電|瓦斯/.test(c.name)&&!/租/.test(c.name)?'水電瓦斯':/電信|網路/.test(c.name)?'電信網路':'房租';}
  if(!S.cats.some(x=>x.cat===cat&&x.sub===sub)){const any=S.cats.find(x=>x.nature==='固定');if(any){cat=any.cat;sub=any.sub;}}
  return {type:'支出',from:c.acct,to:'',cat,sub};
}
function dueItemsMissing(){
  const td=today(),start=parseDate(S.startDate)||new Date(2026,10,1);
  const debt=new Set(S.commits.filter(c=>['貸款','無卡分期','卡分期'].includes(c.type)).map(c=>c.id));
  const have=new Set();
  for(let i=1;i<S.tx.length;i++){const r=S.tx[i]||[];if(!r[12])continue;if(debt.has(r[12])&&r[1]==='支出')continue;const d=parseDate(r[0]);if(d)have.add(r[12]+'|'+d.getFullYear()+'-'+d.getMonth());}
  const out=[];
  S.commits.forEach(c=>{
    if(c.status!=='進行中'||c.type==='卡分期')return;
    const per=num(c.adopt),day=parseInt(c.day,10),first=parseDate(c.first);if(!per||!day||!first)return;
    const end=parseDate(c.end);let cy=first.getFullYear(),cm=first.getMonth(),guard=0;
    while(guard++<240&&(cy<td.getFullYear()||(cy===td.getFullYear()&&cm<=td.getMonth()))){
      const d=new Date(cy,cm,Math.min(day,new Date(cy,cm+1,0).getDate()));
      if(d>=start&&d<=td&&(!end||d<=end)){const key=c.id+'|'+cy+'-'+cm;if(!have.has(key)){out.push({c,d});have.add(key);}}
      cm++;if(cm>11){cm=0;cy++;}
    }
  });
  return out.sort((a,b)=>a.d-b.d);
}

    await io.set('交易!A'+r0+':N'+(r0+rows.length-1),rows);

/* autocomplete */
function suggest(field,q){
  const cnt={};const add=(v,w)=>{if(!v)return;const o=cnt[v]||(cnt[v]={v,w:0,n:0});o.w+=w;o.n++;};
  if(field==='invCode'){S.inv.forEach(r=>{if(r[2])add(String(r[2]),1);});}
  else txObjs().forEach(t=>{const v=t[field];if(!v||isSystem(t)&&field==='note')return;add(v,(t.cat===S.cat&&t.sub===S.sub?100:0)+1);});
  if(field==='project')projectsAll().forEach(p=>add(p,1));
  let arr=Object.values(cnt);const s=String(q||'').trim().toLowerCase();
  if(s)arr=arr.filter(o=>o.v.toLowerCase().indexOf(s)>=0&&o.v.toLowerCase()!==s);
  return arr.sort((a,b)=>b.w-a.w).slice(0,5);
}
function bindAC(input,field,onPick){

    items.forEach(o=>{let sub='';if(field==='invCode'){const r=S.inv.find(x=>String(x[2])===o.v);sub=r?r[3]:'';}else sub=o.n>1?o.n+' 次':'';

    cell.appendChild(box);};
  input.addEventListener('focus',open);input.addEventListener('input',()=>{open();});input.addEventListener('blur',()=>setTimeout(close,120));
}

/* keypad */
const KP={target:null,expr:''};
function kpEval(expr){const tk=String(expr).match(/\d+\.?\d*|\.\d+|[+\-*/]/g);if(!tk)return null;const nums=[],ops=[];let need=true;
  tk.forEach(t=>{if(/^[+\-*/]$/.test(t)){if(!need){ops.push(t);need=true;}}else if(need){nums.push(parseFloat(t));need=false;}});
  if(!nums.length)return null;ops.length=nums.length-1;const n2=[nums[0]],o2=[];
  for(let k=0;k<ops.length;k++){const o=ops[k],b=nums[k+1];if(o==='*')n2[n2.length-1]*=b;else if(o==='/')n2[n2.length-1]=b===0?NaN:n2[n2.length-1]/b;else{o2.push(o);n2.push(b);}}
  let r=n2[0];for(let k=0;k<o2.length;k++)r=o2[k]==='+'?r+n2[k+1]:r-n2[k+1];return isFinite(r)?Math.round(r*100)/100:null;}
function kpShow(){const pretty=KP.expr.replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−');const v=kpEval(KP.expr);
  $('#kpExpr').textContent=/[+\-*/]/.test(KP.expr)?pretty+' =':(KP.target==='twd'?'台幣金額':'金額');$('#kpVal').textContent=v!=null?fmt(v):'0';}
function kpOpen(target){KP.target=target;const v=target==='twd'?S.twd:S.amount;KP.expr=v!=null?String(v):'';kpShow();$('#kpMask').classList.add('on');}
function kpClose(commit){if(commit){const v=kpEval(KP.expr);const val=v!=null&&v>0?v:null;if(KP.target==='twd')S.twd=val;else S.amount=val;renderAmt();if(S.inst)instRecalc();$('#amtBtn').classList.remove('miss');}$('#kpMask').classList.remove('on');}
function kpKey(k){let e=KP.expr;
  if(k==='done'){kpClose(true);return;}
  if(k==='C')e='';else if(k==='back')e=e.slice(0,-1);
  else if(/^[+\-*/]$/.test(k)){if(!e)return;e=/[+\-*/]$/.test(e)?e.slice(0,-1)+k:e+k;}
  else if(k==='.'){const cur=e.split(/[+\-*/]/).pop();if(cur.indexOf('.')>=0)return;e+=cur?'.':'0.';}
  else{if(e.length>24)return;e+=k;}
  KP.expr=e;kpShow();}
(function(){const keys=[['7'],['8'],['9'],['/','÷','op'],['4'],['5'],['6'],['*','×','op'],['1'],['2'],['3'],['-','−','op'],['00'],['0'],['.'],['+','＋','op'],['C','C','op'],['back','','op'],['done','輸入完成','done']];
  const box=$('#kpKeys');keys.forEach(k=>{const b=el('button',{type:'button',class:k[2]||'','aria-label':k[0]==='back'?'刪除一位':null,onclick:()=>kpKey(k[0])},[k[0]==='back'?I('delete',20):(k[1]||k[0])]);box.appendChild(b);});})();

document.addEventListener('keydown',e=>{
  const open=$('#kpMask').classList.contains('on');
  if(open){const k=e.key;if(/^[0-9]$/.test(k))kpKey(k);else if('+-*/.'.indexOf(k)>=0&&k.length===1)kpKey(k);else if(k==='Backspace')kpKey('back');else if(k==='Enter')kpKey('done');else if(k==='Escape')kpClose(false);else return;e.preventDefault();return;}

function miss(sel,msg){const e=$(sel);e.classList.add('miss');setTimeout(()=>e.classList.remove('miss'),2600);toast(msg);return false;}
async function writeTx(row,arr,opt){opt=opt||{};await io.set('交易!A'+row+':N'+row,[arr]);if(opt.twd!==undefined)await io.set('交易!U'+row,[[opt.twd==null?'':opt.twd]]);await io.set('交易!Y'+row+':Z'+row,[[opt.ver||'',opt.id||'']]);}

async function saveInstallment(amount,cur,date,merchant,project,note){
  const kind=$('#iKind').value,n=parseInt($('#iN').value,10),fee=num($('#iFee').value)||0,per=num($('#iPer').value),first=$('#iFirst').value.trim(),day=parseInt($('#iDay').value,10);
  if(!n||n<2)throw {code:'local',message:'期數至少 2'};
  if(!per||!/^\d{4}\/\d{1,2}$/.test(first)||!day)throw {code:'local',message:'請確認每期金額、第一期年月（yyyy/mm）、扣款日'};
  let liab,payAcct;const name=merchant||(S.sub+' 分期');
  if(kind==='卡分期'){const card=instCard();if(!card)throw {code:'local',message:'卡分期請在帳戶選一張信用卡'};payAcct=card.id;liab=card.bank+'-TWD-INST';
    if(!acct(liab)){const r=nextRowOf(S.accounts);await io.set('帳戶!C'+r,[[card.bank]]);await io.set('帳戶!E'+r+':Q'+r,[['TWD','分期','','卡分期','','','','','','','是','記一筆自動建立','使用中']]);}
  }else{liab=$('#iCo').value;payAcct=$('#iPay').value;if(!liab||!payAcct)throw {code:'local',message:'請選分期公司與扣款戶頭'};}
  const cid=nextId('commits'),crow=nextRowOf(S.commits);
  await io.set('承諾!A'+crow+':L'+crow,[[cid,name,kind,payAcct,'固定',amount,'',n,first,day,per,fee]]);
  await io.set('承諾!V'+crow+':W'+crow,[['記一筆建立：'+date+' 購買 '+fmt(amount)+' 分 '+n+' 期','']]);
  const colA=await io.get('交易!A1:A');const r=colA.length+1;
  await writeTx(r,[date,'支出',liab,'',amount,cur,S.cat,S.sub,merchant,project,'',S.pp,cid,(note?note+'；':'')+'分期 '+n+' 期，每期 '+fmt(per)],{id:newId()});
  return {cid,r,crow};
}
function invDerive(){const act=$('#fInvAct').value;let q=num($('#fInvQty').value),p=num($('#fInvPrice').value),tot=S.amount;
  if(act==='股利'){if(tot==null)return null;if(!q){q=1;p=tot;}else p=tot/q;return {q,p,fee:0};}
  if(!q)return null;if(tot==null&&p!=null)tot=q*p;if(tot==null)return null;if(p==null)p=tot/q;const gross=q*p;return {q,p,fee:Math.round((act==='買進'?tot-gross:gross-tot)*100)/100};}

function txRow(t,onTap){

  const ins=instOf(t);
  const who=ins?acctShort(ins.type==='卡分期'?ins.acct:t.from):(t.to?acctShort(t.from)+' → '+acctShort(t.to):acctShort(t.from));
  const row=el('div',{class:'rowi'+(onTap?' tap':''),onclick:onTap?()=>onTap(t):null},[
    el('span',{class:'cicon',style:'color:'+m.color,html:ic(m.icon,18)}),
    el('div',{class:'t'},[el('b',{},[title]),el('small',{},[(t.type==='還款'?'還款':(t.cat+(t.sub?'／'+t.sub:'')))+' · '+who])]),
    el('div',{class:'v'},[el('div',{class:'num',style:'font-size:16px;font-weight:600;color:'+(neg?'var(--coral)':pos?'var(--mint)':'var(--tx)')},[(neg?'−':pos?'＋':'')+fmt(t.amt)+(t.cur!=='TWD'?' '+t.cur:'')]),
      el('div',{},[billOf(t)?el('span',{class:'tag a'},['帳單分期 '+billOf(t).n+' 期']):null,ins?(ins.status==='已結清'?el('span',{class:'tag g'},['分期已繳清']):el('span',{class:'tag a'},['分 '+ins.n+' 期・每期 '+fmt(ins.adopt)])):null,t.ver==='待核實'?el('span',{class:'tag a'},['待核實']):null,t.pp==='公'?el('span',{class:'tag b'},['公']):null,t.project?el('span',{class:'tag'},[t.project]):null])])]);
  return row;
}
function billOf(t){if(!t.cid||t.type!=='還款')return null;const c=S.commits.find(x=>x.id===t.cid);return c&&c.type==='卡分期'?c:null;}
function instOf(t){if(!t.cid||t.type!=='支出')return null;const c=S.commits.find(x=>x.id===t.cid);return c&&['卡分期','無卡分期'].includes(c.type)?c:null;}
function instDueIn(y,m){let sum=0;S.commits.forEach(c=>{if(!['卡分期','無卡分期'].includes(c.type))return;const f=parseDate(c.first),n=num(c.n),per=num(c.adopt);if(!f||!n||!per)return;const k=(y-f.getFullYear())*12+(m-f.getMonth());if(k>=0&&k<n)sum+=per;});return sum;}

function period(){const L=S.ledger,a=new Date(L.anchor);let s,e,label;
  if(L.mode==='日'){s=new Date(a);e=new Date(a);label=ymd(a)+'（'+WD[a.getDay()]+'）';}
  else if(L.mode==='週'){s=new Date(a);s.setDate(a.getDate()-((a.getDay()+6)%7));e=new Date(s);e.setDate(s.getDate()+6);label=p2(s.getMonth()+1)+'/'+p2(s.getDate())+' – '+p2(e.getMonth()+1)+'/'+p2(e.getDate());}
  else{s=new Date(a.getFullYear(),a.getMonth(),1);e=new Date(a.getFullYear(),a.getMonth()+1,0);label=a.getFullYear()+' 年 '+(a.getMonth()+1)+' 月';}
  return {s,e,label};}

  let exp=0,inc=0,pub=0;list.forEach(t=>{if(t.type==='支出'){exp+=t.twd;if(t.pp==='公')pub+=t.twd;}else if(t.type==='收入')inc+=t.twd;});

    const c2=el('div',{class:'card',style:'margin-top:10px'},[el('h2',{},['資料']),el('div',{class:'kv'},[el('div',{class:'k'},['記帳起始日']),el('div',{class:'v num'},[S.startDate||'—']),el('div',{class:'k'},['交易筆數']),el('div',{class:'v num'},[String(txObjs().length)]),el('div',{class:'k'},['連續記帳']),el('div',{class:'v num'},[streak()+' 天'])]),
      el('a',{href:SHEET_URL,target:'_blank',rel:'noopener',style:'color:var(--sky);display:inline-block;margin-top:10px'},['開啟 Google 試算表'])]);body.appendChild(c2);
    body.appendChild(el('div',{class:'note'},['所有資料都存在你的 Google 試算表，這個頁面只是操作介面。每天早上另有排程會自動寫入到期的承諾扣款。']));
  }
}
$('#sTabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){S.setTab=b.dataset.v;renderSettings();}});

/* ---------- boot ---------- */
$$('[data-i]').forEach(e=>{e.innerHTML=ic(e.dataset.i,22);e.style.display='inline-flex';});
$('#btnRefresh').innerHTML=ic('refresh-cw',16);$('#lPrev').innerHTML=ic('chevron-left',18);$('#lNext').innerHTML=ic('chevron-right',18);
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.p);});
$('#btnRefresh').addEventListener('click',()=>{if(mcp)loadAll();});
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(['add','ledger','dash','budget','settings'].indexOf(h)>=0&&h!==S.page)go(h);});
(function boot(){
  try{const c=JSON.parse(ls('fin:cache')||'null');if(c)applyData(c);}catch(_){}
  const wide=window.matchMedia('(min-width:900px)').matches;const h=(location.hash||'').slice(1);
  fillStatic();fillAccounts(false);renderChrome();
  go(['add','ledger','dash','budget','settings'].indexOf(h)>=0?h:(wide?'dash':'add'));
})();
(async()=>{
  if(STANDALONE){
    mcp={standalone:true};
    const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;document.head.appendChild(s);
    loadTok();
    if(!auth.tok){for(let i=0;i<80&&!initGis();i++)await sleep(150);try{await requestToken('none');}catch(_){}}
    if(!auth.tok){showLogin();return;}
    await loadAll();
    if(S.page==='add'&&!window.matchMedia('(min-width:900px)').matches&&S.amount==null&&!$('#shMask').classList.contains('on'))kpOpen('amount');
    return;
  }
  try{mcp=await window.claude.use('mcp');}catch(_){mcp=null;}
  if(!mcp){setStatus('err');banner('這個檢視無法使用 Google Sheets 連接器。請在 claude.ai（網頁或 App）開啟這個頁面，並允許它使用 Google Sheets。',true);return;}
  await loadAll();
  if(S.page==='add'&&!window.matchMedia('(min-width:900px)').matches&&S.amount==null&&!$('#shMask').classList.contains('on'))kpOpen('amount');
})();
})();
</script>
